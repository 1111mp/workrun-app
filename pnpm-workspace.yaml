packages:
  - 'apps/**/*'
  - 'packages/**/*'

allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  # Embedded Tauri WebDriver does not use these browser-driver installers.
  edgedriver: false
  geckodriver: false
  msw: false
  unrs-resolver: true

