name: Clippy Lint

on:
  pull_request:
  workflow_dispatch:
env:
  HUSKY: 0

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check src-tauri changes
        if: github.event_name != 'workflow_dispatch'
        id: check_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'apps/desktop/src-tauri/**'

      - name: Skip if src-tauri not changed
        if: github.event_name != 'workflow_dispatch' && steps.check_changes.outputs.rust != 'true'
        run: echo "No src-tauri changes, skipping clippy lint."

      - name: Continue if src-tauri changed
        if: github.event_name != 'workflow_dispatch' && steps.check_changes.outputs.rust == 'true'
        run: echo "src-tauri changed, running clippy lint."

      - name: Manual trigger - always run
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual trigger detected: skipping changes check and running clippy."

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'pnpm'

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter workrun...

      # Cargo does not run Tauri CLI's beforeBuildCommand, which prepares uv.
      - name: Prepare uv sidecar
        run: node apps/desktop/scripts/prebuild.mjs ${{ matrix.target }}

      - name: Ensure resources python-wheels directory exists
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p resources/python-wheels
          touch resources/python-wheels/.gitkeep

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            apps/desktop -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
