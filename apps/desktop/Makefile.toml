[config]
# Skip loading of all core tasks which saves up a bit on toml parsing and task creation
skip_core_tasks = true
# Skips loading Git related environment variables
skip_git_env_info = true
# Skips loading rust related environment variables
skip_rust_env_info = true
# Skips loading the current crate related environment variables
skip_crate_env_info = true

# --- Backend ---

[tasks.rust-fmt]
description = "Format all Rust source files using rustfmt"
install_crate = "rustfmt"
cwd = "apps/desktop"
command = "cargo"
args = ["fmt", "--", "--emit=files"]

[tasks.rust-clippy]
description = "Run Clippy lints for all targets and features, deny all warnings"
cwd = "apps/desktop"
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]

# --- Frontend ---

[tasks.typecheck]
description = "Run TypeScript type checking"
command = "pnpm"
args = ["typecheck"]

[tasks.lint-staged]
description = "Run lint-staged on staged frontend files"
command = "pnpm"
args = ["exec", "lint-staged"]

# --- Git Hooks ---

[tasks.pre-commit]
description = "Pre-commit hook: format and lint Rust, and lint staged frontend files"
script_runner = "bash"
script = '''
set -e

# git diff returns 1 for changes; other failures must stop the hook.
has_changes() {
  local status=0
  git diff --quiet "$@" || status=$?
  case "$status" in
    0) return 1 ;;
    1) return 0 ;;
    *) exit "$status" ;;
  esac
}

if has_changes --cached -- "*.rs" Cargo.toml Cargo.lock; then
  # Compare worktree changes so existing unstaged edits are not staged implicitly.
  before_format=$(git diff --binary -- "*.rs")
  cargo make --makefile apps/desktop/Makefile.toml rust-fmt
  after_format=$(git diff --binary -- "*.rs")
  if [ "$before_format" != "$after_format" ]; then
    echo "Rust formatting changed files. Review and stage the changes, then commit again."
    exit 1
  fi
  cargo make --makefile apps/desktop/Makefile.toml rust-clippy
fi

if has_changes --cached -- "*.js" "*.mjs" "*.cjs" "*.jsx" "*.ts" "*.tsx" "*.json" "*.md" "*.css" "*.html"; then
  cargo make --makefile apps/desktop/Makefile.toml lint-staged
fi
'''

[tasks.pre-push]
description = "Pre-push hook: run clippy for Rust and type checking for frontend"
script_runner = "bash"
script = '''
set -e

has_changes() {
  local status=0
  git diff --quiet "$base" HEAD -- "$@" || status=$?
  case "$status" in
    0) return 1 ;;
    1) return 0 ;;
    *) exit "$status" ;;
  esac
}

branch=$(git symbolic-ref --quiet HEAD) || {
  status=$?
  if [ "$status" -ne 1 ]; then
    exit "$status"
  fi
  branch=""
}
upstream=""
if [ -n "$branch" ]; then
  upstream=$(git for-each-ref --format='%(upstream)' "$branch")
fi
if [ -n "$upstream" ]; then
  base=$(git rev-parse --verify "$upstream")
else
  # A first push (or detached HEAD) has no upstream: check the complete tree.
  base=$(git hash-object -t tree /dev/null)
fi

if has_changes "*.rs" Cargo.toml Cargo.lock; then
  cargo make --makefile apps/desktop/Makefile.toml rust-clippy
fi

if has_changes "*.js" "*.mjs" "*.cjs" "*.jsx" "*.ts" "*.tsx" "*.json" "*.css" "*.html"; then
  cargo make --makefile apps/desktop/Makefile.toml typecheck
fi
'''
