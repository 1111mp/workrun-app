[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.dependencies]
adk-rust = { version = "2.2.0" }
anyhow = "1.0.104"
bitflags = { version = "2.13.1" }
chrono = "0.4.45"
flexi_logger = "0.31.10"
flate2 = "1.1.9"
ignore = "0.4.25"
log = "0.4.34"
parking_lot = { version = "0.12.5", features = ["hardware-lock-elision"] }
semver = "1.0.28"
serde = { version = "1.0.229" }
serde_json = { version = "1.0.151" }
serde_yaml_ng = { version = "0.10.0" }
sha2 = "0.10.9"
sqlx = { version = "0.9.0" }
tauri = { version = "2.11.5" }
thiserror = { version = "2.0.20" }
tar = "0.4.46"
toml = "0.9.12"
toml_edit = "0.25.13"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0" }
walkdir = "2.5.0"

deelevate = "0.2.0"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }

single_match = "allow"
tabs_in_doc_comments = "allow"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
