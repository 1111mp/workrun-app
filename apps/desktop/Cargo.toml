[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.dependencies]
adk-rust = { version = "2.3.0" }
anyhow = "1.0.104"
bitflags = { version = "2.13.2" }
chrono = "0.4.45"
chrono-tz = "0.10.4"
croner = "4.0.1"
flate2 = "1.1.10"
flexi_logger = "0.31.10"
ignore = "0.4.33"
log = "0.4.34"
parking_lot = { version = "0.12.5", features = ["hardware-lock-elision"] }
semver = "1.0.28"
serde = { version = "1.0.229" }
serde_json = { version = "1.0.154" }
serde_yaml_ng = { version = "0.10.0" }
sha2 = "0.11.0"
sqlx = { version = "0.9.0" }
tar = "0.4.46"
tauri = { version = "2.12.3" }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.17"
uuid = { version = "1.28.0" }
walkdir = "2.5.0"
zip = "9.0.2"

deelevate = "0.2.0"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }

single_match = "allow"
tabs_in_doc_comments = "allow"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
